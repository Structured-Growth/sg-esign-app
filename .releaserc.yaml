branches:
  - main
  - name: dev
    channel: beta
    prerelease: beta
  - name: "feature-SG-*"
    prerelease: true
plugins:
  - '@semantic-release/commit-analyzer'
  - - '@semantic-release/release-notes-generator'
    - writerOpts:
        mainTemplate: |
          {{> header}}

          ## Reason for change
            
          _
          
          ## Changes made
          
          {{#each commitGroups}}

          {{#if title}}
          ### {{title}}
          
          {{/if}}
          {{#each commits}}
          {{> commit root=@root}}
          {{/each}}
          
          {{/each}}

          {{> footer}}
          
          ## Test cases created or updated

          - **created**: _.ts
          - **updated**: _.ts
          
          No test cases was created or updated.

          ## Risk assessment

          Do the changes impact the software requirements (e.g. high level requirements): NO
          Do the changes impact the software specifications (e.g. API): NO
          Do the test cases cover the changes made: YES
  - - '@semantic-release/github'
  - - '@codedependant/semantic-release-docker'
    - dockerProject: "structuredgrowth"
      dockerBuildFlags:
        platform: linux/amd64
      dockerArgs:
        github_token: "{{env.GITHUB_TOKEN}}"
      dockerTags:
        - '{{#if prerelease.[0]}}{{prerelease.[0]}}{{else}}latest{{/if}}'
        - '{{#if prerelease.[0]}}{{major}}-{{prerelease.[0]}}{{else}}{{major}}-latest{{/if}}'
        - '{{version}}'
